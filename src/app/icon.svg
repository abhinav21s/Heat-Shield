<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8"/>
      <stop offset="100%" stop-color="#F2CC8F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D62828" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield Container with Shadow -->
  <rect width="64" height="64" rx="16" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Outer Protective Shield Outline -->
  <path d="M32 10 L48 16 V28 C48 40 32 50 32 50 C32 50 16 40 16 28 V16 Z" 
        fill="#F8EDE6" 
        fill-opacity="0.2" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Thermal / Sun Fire Core -->
  <path d="M32 20 C35.5 20 38 23 38 26.5 C38 31 32 37 32 37 C32 37 26 31 26 26.5 C26 23 28.5 20 32 20 Z" 
        fill="url(#sunGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1.5"/>

  <!-- Core Sparkle Center -->
  <circle cx="32" cy="27" r="2.5" fill="#FFFFFF"/>
</svg>
